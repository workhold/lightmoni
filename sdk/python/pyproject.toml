[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lightmoni-sdk"
version = "0.1.0"
description = "Bounded OTLP/HTTP telemetry for LightMoni"
requires-python = ">=3.9"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]

[project.urls]
Homepage = "https://github.com/workhold/lightmoni"
Repository = "https://github.com/workhold/lightmoni"
Source = "https://github.com/workhold/lightmoni/tree/main/sdk/python"
Issues = "https://github.com/workhold/lightmoni/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["lightmoni*"]
