[package]
name = "lightmoni"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Bounded OTLP/HTTP telemetry for LightMoni"
license = "Apache-2.0"
readme = "README.md"
repository = "https://github.com/workhold/lightmoni"
homepage = "https://github.com/workhold/lightmoni/tree/main/sdk/rust"

[dependencies]
reqwest = { version = "=0.12.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "=1.0.138"
uuid = { version = "=1.12.1", features = ["v4"] }
httpdate = "=1.0.3"
