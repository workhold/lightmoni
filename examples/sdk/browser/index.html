<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LightMoni 浏览器 SDK 示例</title>
<style>
  body{max-width:720px;margin:64px auto;padding:0 24px;font:16px/1.6 system-ui;color:#243047;background:#f5f7fa}
  label{display:block;margin:16px 0}input{display:block;width:100%;box-sizing:border-box;padding:10px;border:1px solid #aab7cc;border-radius:6px}
  button{padding:10px 18px;border:0;border-radius:6px;background:#2563eb;color:white;cursor:pointer;margin-right:8px}button:disabled{opacity:.5}
  pre{white-space:pre-wrap;background:white;padding:18px;border-radius:8px}
</style>
<h1>浏览器 SDK 接入示例</h1>
<p>浏览器通过业务后端转发埋点。后端持有全局 Key，页面无需填写凭证。</p>
<label>业务采集入口<input id="endpoint" value=""></label>
<button id="connect">开始监控</button><button id="record" disabled>记录事件</button><button id="flush" disabled>发送并等待确认</button>
<pre id="output">准备就绪</pre>
<script type="module">
  import { installBrowserMonitor } from "../../../sdk/typescript/dist/src/browser.js";
  let monitor, counter;
 document.querySelector("#endpoint").value=location.origin;
  const output = document.querySelector("#output");
  document.querySelector("#connect").onclick = () => {
    try {
      monitor = installBrowserMonitor({ service: "example-browser", table: "web", endpoint: document.querySelector("#endpoint").value });
      counter = monitor.client.counter("browser.clicks");
      document.querySelector("#record").disabled = false;document.querySelector("#flush").disabled = false;document.querySelector("#connect").disabled = true;
      output.textContent = "已启动。页面关闭时只能尽力发送；此处“发送并等待确认”才能等待持久化 ACK。";
    } catch(error) { output.textContent = error.message; }
  };
  document.querySelector("#record").onclick = () => { counter.add(1, { button: "demo", path: location.pathname });monitor.client.log("info", "demo clicked", { button: "demo" });output.textContent = JSON.stringify(monitor.client.stats(),null,2); };
  document.querySelector("#flush").onclick = async () => { try { await monitor.client.flush({ timeoutMs: 5000 });output.textContent = "已获持久化确认\n"+JSON.stringify(monitor.client.stats(),null,2); } catch(error) { output.textContent = error.message; } };
</script>
</html>
